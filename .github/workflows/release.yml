name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update
      - run: sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev libgtk-3-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
        working-directory: projects/recode
      - run: npm run build
        working-directory: projects/recode
      - run: cargo build --release --bin recode --manifest-path projects/recode/src-tauri/Cargo.toml
      - run: bash projects/recode/scripts/generate-update-manifest.sh ${{ github.ref_name }} projects/recode/src-tauri/target/release/recode 'Release ${{ github.ref_name }}'
      - uses: actions/upload-artifact@v4
        with:
          name: recode-binary
          path: projects/recode/src-tauri/target/release/recode
