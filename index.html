<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>recode</title>
    <link rel="stylesheet" href="/src/styles/global.css" />
    <style>
      .app-root-loading {
        display: grid;
        grid-template-columns: var(--sidebar-width) 1fr;
        min-height: 100vh;
        gap: var(--gap);
        padding: var(--shell-padding);
        background:
          radial-gradient(circle at top left, rgba(139, 92, 246, 0.16), transparent 45%),
          radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.07), transparent 45%),
          var(--bg-base);
        color: var(--text-primary);
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      }
      .app-root-loading::before {
        content: 'recode';
        grid-column: 1;
        align-self: end;
        padding: 14px;
        font-weight: 800;
        font-size: 18px;
        color: var(--text-primary);
      }
      .app-root-loading::after {
        content: 'Loading…';
        grid-column: 2;
        padding: 14px;
        color: var(--text-secondary);
      }
    </style>
  </head>
  <body>
    <noscript>recode requires JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
